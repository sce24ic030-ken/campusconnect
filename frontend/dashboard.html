<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>CampusConnect | Student Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- ==================================================
     MAIN APPLICATION
     ================================================== -->

<div class="app">


    <!-- ==================================================
         SIDEBAR
         ================================================== -->

    <aside class="sidebar">

        <!-- LOGO -->

        <div class="brand">

            <div class="brand-logo">
                🎓
            </div>

            <div class="brand-name">
                Campus<span>Connect</span>
            </div>

        </div>


        <!-- STUDENT PROFILE -->

        <div class="student-mini">

            <div class="student-avatar">
                PB
            </div>

            <div>

                <strong>
                    Priya Bhavani
                </strong>

                <small>
                    BCA Student
                </small>

            </div>

        </div>


        <!-- NAVIGATION -->

        <nav class="sidebar-nav">

            <button
                class="nav-item active"
                data-page="dashboard"
                type="button"
            >

                <span class="nav-icon">
                    ⌂
                </span>

                <span>
                    Dashboard
                </span>

            </button>


            <button
                class="nav-item"
                data-page="courses"
                type="button"
            >

                <span class="nav-icon">
                    ▣
                </span>

                <span>
                    My Courses
                </span>

            </button>


            <button
                class="nav-item"
                data-page="timetable"
                type="button"
            >

                <span class="nav-icon">
                    ▦
                </span>

                <span>
                    Timetable
                </span>

            </button>


            <button
                class="nav-item"
                data-page="assignments"
                type="button"
            >

                <span class="nav-icon">
                    📝
                </span>

                <span>
                    Assignments
                </span>

            </button>


            <button
                class="nav-item"
                data-page="attendance"
                type="button"
            >

                <span class="nav-icon">
                    ◔
                </span>

                <span>
                    Attendance
                </span>

            </button>


            <button
                class="nav-item"
                data-page="campus"
                type="button"
            >

                <span class="nav-icon">
                    🏫
                </span>

                <span>
                    Campus
                </span>

            </button>


            <button
                class="nav-item"
                data-page="settings"
                type="button"
            >

                <span class="nav-icon">
                    ⚙
                </span>

                <span>
                    Settings
                </span>

            </button>

        </nav>


        <!-- LOGOUT -->

        <div class="sidebar-bottom">

            <button
                class="logout-btn"
                id="logoutBtn"
                type="button"
            >

                <span>
                    ↪
                </span>

                <span>
                    Logout
                </span>

            </button>

        </div>

    </aside>



    <!-- ==================================================
         MAIN CONTENT
         ================================================== -->

    <main class="main">


        <!-- ==================================================
             TOP BAR
             ================================================== -->

        <header class="topbar">


            <!-- PAGE TITLE -->

            <div class="page-heading">

                <div class="small-heading">
                    STUDENT PORTAL
                </div>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

            </div>


            <!-- TOP RIGHT -->

            <div class="topbar-actions">


                <!-- LIVE CLOCK -->

                <div
                    class="digital-clock"
                    id="clock"
                >
                    00:00:00
                </div>


                <!-- NOTIFICATION -->

                <button
                    class="notification-btn"
                    id="notificationBtn"
                    type="button"
                    aria-label="Notifications"
                >

                    🔔

                    <span class="notification-dot"></span>

                </button>


                <!-- PROFILE -->

                <button
                    class="profile-btn"
                    id="profileBtn"
                    type="button"
                >

                    <div class="profile-avatar">
                        PB
                    </div>

                    <span>
                        Priya Bhavani
                    </span>

                    <span class="arrow">
                        ▾
                    </span>

                </button>

            </div>

        </header>



        <!-- ==================================================
             DYNAMIC PAGE CONTENT
             ================================================== -->

        <section
            id="content"
            aria-live="polite"
        >

        </section>


    </main>

</div>



<!-- ==================================================
     MODAL
     ================================================== -->

<div
    class="modal hidden"
    id="modal"
    role="dialog"
    aria-modal="true"
    aria-label="Information"
>

    <div class="modal-box">


        <!-- CLOSE BUTTON -->

        <button
            class="modal-close"
            id="modalClose"
            type="button"
            aria-label="Close"
        >
            ×
        </button>


        <!-- DYNAMIC MODAL CONTENT -->

        <div id="modalContent">

        </div>

    </div>

</div>



<!-- ==================================================
     TOAST MESSAGE
     ================================================== -->

<div
    class="toast"
    id="toast"
    role="status"
    aria-live="polite"
>
    Successfully completed
</div>



<!-- ==================================================
     JAVASCRIPT
     ================================================== -->

<script src="script.js"></script>
```

</body>
</html>
