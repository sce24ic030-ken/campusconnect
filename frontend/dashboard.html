<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusConnect | Student Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#f5f3ff;
    color:#28243b;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}


/* =========================================================
   MAIN APP
========================================================= */

.app{
    min-height:100vh;
    display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;

    width:250px;

    padding:24px 16px;

    color:white;

    background:
        radial-gradient(
            circle at 80% 10%,
            rgba(192,76,255,.35),
            transparent 25%
        ),
        linear-gradient(
            180deg,
            #181330,
            #291650,
            #45218c
        );

    box-shadow:5px 0 30px rgba(40,20,80,.15);

    z-index:100;
}


/* LOGO */

.brand{
    display:flex;
    align-items:center;
    gap:11px;

    padding:5px 10px 25px;
}

.brand-logo{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:13px;

    font-size:22px;

    background:linear-gradient(
        135deg,
        #9b3cff,
        #ff3e9c
    );

    box-shadow:0 8px 25px rgba(185,55,255,.4);
}

.brand-name{
    font-size:19px;
    font-weight:700;
}

.brand-name span{
    color:#d995ff;
}


/* STUDENT */

.student-mini{
    display:flex;
    align-items:center;
    gap:11px;

    padding:14px 10px;

    margin-bottom:18px;

    border-radius:15px;

    background:rgba(255,255,255,.08);
}

.student-avatar{
    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        #ff913d,
        #e632a5
    );

    font-size:12px;
    font-weight:700;
}

.student-mini strong{
    display:block;
    font-size:12px;
}

.student-mini small{
    display:block;
    margin-top:2px;
    color:#bcb7d8;
    font-size:10px;
}


/* NAVIGATION */

.sidebar-nav{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.nav-item{
    width:100%;

    display:flex;
    align-items:center;
    gap:14px;

    padding:13px 15px;

    border-radius:13px;

    color:#ddd8f0;

    background:transparent;

    text-align:left;

    font-size:13px;

    transition:.25s;
}

.nav-item:hover{
    color:white;
    background:rgba(255,255,255,.08);
    transform:translateX(3px);
}

.nav-item.active{
    color:white;

    background:
        linear-gradient(
            90deg,
            #713de0,
            #a434df
        );

    box-shadow:
        0 9px 25px rgba(126,54,227,.35);
}

.nav-icon{
    width:22px;
    text-align:center;
    font-size:17px;
}


/* LOGOUT */

.sidebar-bottom{
    position:absolute;
    left:16px;
    right:16px;
    bottom:20px;
}

.logout-btn{
    width:100%;

    padding:13px;

    border-radius:12px;

    color:#ddd8ef;

    background:rgba(255,255,255,.08);

    font-size:13px;

    transition:.25s;
}

.logout-btn:hover{
    background:rgba(255,70,130,.22);
}


/* =========================================================
   MAIN AREA
========================================================= */

.main{
    width:calc(100% - 250px);

    margin-left:250px;

    min-height:100vh;

    padding:27px 35px;

    background:
        radial-gradient(
            circle at 90% 5%,
            rgba(221,194,255,.5),
            transparent 25%
        ),
        #f7f5ff;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:25px;
}

.small-heading{
    color:#8767c1;

    font-size:10px;
    font-weight:700;

    letter-spacing:1.5px;
}

.page-heading h1{
    margin-top:2px;

    font-size:28px;
}

.topbar-actions{
    display:flex;
    align-items:center;
    gap:10px;
}


/* CLOCK */

.digital-clock{
    padding:10px 14px;

    border-radius:12px;

    background:white;

    color:#6c6878;

    font-size:12px;

    box-shadow:0 6px 22px rgba(60,40,100,.08);
}


/* NOTIFICATION */

.notification-btn{
    position:relative;

    width:43px;
    height:43px;

    border-radius:13px;

    background:white;

    font-size:17px;

    box-shadow:0 6px 22px rgba(60,40,100,.08);

    transition:.25s;
}

.notification-btn:hover{
    transform:translateY(-2px);
}

.notification-dot{
    position:absolute;

    top:8px;
    right:8px;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff3d91;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:0 0 0 0 rgba(255,61,145,.5);
    }

    70%{
        box-shadow:0 0 0 7px rgba(255,61,145,0);
    }

    100%{
        box-shadow:0 0 0 0 rgba(255,61,145,0);
    }

}


/* PROFILE */

.profile-btn{
    display:flex;
    align-items:center;
    gap:8px;

    padding:5px 12px 5px 5px;

    border-radius:13px;

    background:white;

    color:#413d4d;

    font-size:12px;

    box-shadow:0 6px 22px rgba(60,40,100,.08);
}

.profile-avatar{
    width:35px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:white;

    background:linear-gradient(
        135deg,
        #ff913d,
        #e632a5
    );

    font-size:11px;
    font-weight:700;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    overflow:hidden;

    padding:30px;

    border-radius:24px;

    color:white;

    background:
        radial-gradient(
            circle at 95% 10%,
            rgba(255,255,255,.16),
            transparent 22%
        ),
        linear-gradient(
            110deg,
            #392078,
            #6939d8 55%,
            #ae3ac7
        );

    box-shadow:
        0 17px 42px rgba(99,49,190,.25);
}

.hero h2{
    position:relative;
    z-index:2;

    margin-bottom:7px;

    font-size:25px;
}

.hero p{
    position:relative;
    z-index:2;

    color:#eee7ff;

    font-size:13px;
}

.hero-date{
    position:relative;
    z-index:2;

    margin-top:17px;

    color:#e9ddff;

    font-size:11px;
}


/* =========================================================
   STAT CARDS
========================================================= */

.stats-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:17px;

    margin:21px 0;
}

.stat-card{
    display:flex;
    align-items:center;

    gap:14px;

    padding:20px;

    border-radius:19px;

    background:white;

    box-shadow:
        0 8px 27px rgba(62,42,100,.08);

    transition:.25s;
}

.stat-card:hover{
    transform:translateY(-5px);

    box-shadow:
        0 16px 35px rgba(62,42,100,.14);
}

.stat-icon{
    width:50px;
    height:50px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    background:#eee9ff;

    font-size:22px;
}

.stat-card:nth-child(2) .stat-icon{
    background:#ffe7f0;
}

.stat-card:nth-child(3) .stat-icon{
    background:#e1faef;
}

.stat-card:nth-child(4) .stat-icon{
    background:#fff0dc;
}

.stat-card h3{
    font-size:22px;
}

.stat-card p{
    margin-top:3px;

    color:#898591;

    font-size:11px;
}


/* =========================================================
   SECTION
========================================================= */

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:26px 0 13px;
}

.section-head h2{
    font-size:19px;
}

.section-subtitle{
    color:#96929e;
    font-size:11px;
}


/* BUTTON */

.gradient-btn{
    padding:9px 18px;

    border-radius:22px;

    color:white;

    background:
        linear-gradient(
            90deg,
            #713ee2,
            #e737a6
        );

    font-size:11px;
    font-weight:600;

    box-shadow:
        0 8px 22px rgba(120,53,220,.25);

    transition:.25s;
}

.gradient-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 27px rgba(120,53,220,.35);
}


/* =========================================================
   TIMETABLE
========================================================= */

.table-container{
    padding:13px;

    border-radius:20px;

    background:white;

    overflow-x:auto;

    box-shadow:
        0 8px 27px rgba(62,42,100,.08);
}

.timetable{
    width:100%;

    border-collapse:separate;

    border-spacing:6px;
}

.timetable th{
    padding:12px 10px;

    border-radius:10px;

    background:#f0edff;

    color:#624ba3;

    font-size:10px;
}

.timetable td{
    min-width:120px;

    padding:13px 8px;

    border-radius:11px;

    text-align:center;

    font-size:10px;
    font-weight:600;

    transition:.2s;
}

.timetable td:hover{
    transform:scale(1.02);
}

.time-cell{
    min-width:105px;

    background:#f5f5f7 !important;

    color:#76727e !important;
}

.subject-blue{
    background:#e4f1ff;
    color:#397caf;
}

.subject-pink{
    background:#ffe4ef;
    color:#c13876;
}

.subject-green{
    background:#e2f9ed;
    color:#26926a;
}

.subject-orange{
    background:#fff0dc;
    color:#bd7b21;
}

.subject-purple{
    background:#eee8ff;
    color:#704cae;
}

.break-cell{
    background:#f2f2f3 !important;
    color:#999 !important;
}


/* =========================================================
   QUICK ACTIONS
========================================================= */

.quick-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:17px;
}

.quick-card{
    padding:23px 15px;

    border-radius:18px;

    background:white;

    text-align:center;

    box-shadow:
        0 8px 27px rgba(62,42,100,.07);

    transition:.25s;
}

.quick-card:hover{
    transform:translateY(-6px);

    box-shadow:
        0 17px 35px rgba(62,42,100,.14);
}

.quick-icon{
    margin-bottom:9px;

    font-size:27px;
}

.quick-card strong{
    font-size:12px;
}


/* =========================================================
   CAMPUS
========================================================= */

.campus-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:17px;
}

.campus-card{
    position:relative;

    height:175px;

    overflow:hidden;

    border-radius:19px;

    background-size:cover;
    background-position:center;

    box-shadow:
        0 8px 27px rgba(62,42,100,.1);

    transition:.3s;
}

.campus-card:hover{
    transform:translateY(-5px);
}

.campus-card::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            transparent 20%,
            rgba(0,0,0,.78)
        );
}

.campus-info{
    position:absolute;

    left:16px;
    bottom:14px;

    z-index:2;

    color:white;
}

.campus-info strong{
    display:block;

    font-size:13px;
}

.campus-info small{
    display:block;

    margin-top:3px;

    color:#ddd;

    font-size:9px;
}


/* =========================================================
   LIST CARDS
========================================================= */

.list-container{
    display:grid;

    gap:13px;
}

.list-card{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:18px 20px;

    border-radius:16px;

    background:white;

    box-shadow:
        0 6px 22px rgba(62,42,100,.07);

    transition:.2s;
}

.list-card:hover{
    transform:translateX(3px);
}

.list-card strong{
    font-size:13px;
}

.list-card small{
    display:block;

    margin-top:4px;

    color:#9995a1;

    font-size:10px;
}


/* BADGES */

.badge{
    padding:6px 11px;

    border-radius:20px;

    background:#eee8ff;

    color:#6b47aa;

    font-size:10px;
    font-weight:600;
}

.badge.green{
    background:#e2f9ed;
    color:#268b67;
}

.badge.orange{
    background:#fff0dc;
    color:#ba7920;
}

.badge.pink{
    background:#ffe4ef;
    color:#bd376f;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-container{
    width:100%;
}

.progress-header{
    display:flex;
    justify-content:space-between;

    font-size:11px;
}

.progress-bar{
    height:8px;

    margin-top:8px;

    overflow:hidden;

    border-radius:20px;

    background:#eeeeF2;
}

.progress-fill{
    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #713fe2,
            #e537a5
        );
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(20,15,40,.65);

    backdrop-filter:blur(6px);
}

.modal.hidden{
    display:none;
}

.modal-box{
    position:relative;

    width:min(520px,100%);

    padding:30px;

    border-radius:23px;

    background:white;

    box-shadow:
        0 25px 80px rgba(0,0,0,.3);

    animation:modalIn .25s ease;
}

@keyframes modalIn{

    from{
        opacity:0;
        transform:translateY(20px) scale(.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.modal-close{
    position:absolute;

    top:12px;
    right:13px;

    width:34px;
    height:34px;

    border-radius:50%;

    background:#f0eff5;

    color:#555;

    font-size:22px;
}

.modal-box h2{
    margin-bottom:17px;

    font-size:21px;
}

.modal-box p{
    margin:8px 0;

    color:#666;

    font-size:12px;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    right:25px;
    bottom:25px;

    z-index:2000;

    padding:13px 18px;

    border-radius:13px;

    color:white;

    background:#25203b;

    font-size:12px;

    opacity:0;

    transform:translateY(15px);

    pointer-events:none;

    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}


/* =========================================================
   DARK MODE
========================================================= */

body.dark{
    background:#12101d;
    color:#f4f1ff;
}

body.dark .main{
    background:#12101d;
}

body.dark .stat-card,
body.dark .table-container,
body.dark .quick-card,
body.dark .list-card,
body.dark .digital-clock,
body.dark .notification-btn,
body.dark .profile-btn{
    background:#201d2e;
    color:#f5f2ff;
}

body.dark .modal-box{
    background:#201d2e;
    color:white;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px){

    .sidebar{
        width:80px;
    }

    .brand-name,
    .student-mini div:not(.student-avatar),
    .nav-item span:not(.nav-icon),
    .logout-btn span:last-child{
        display:none;
    }

    .brand{
        justify-content:center;
    }

    .student-mini{
        justify-content:center;
    }

    .nav-item{
        justify-content:center;
    }

    .main{
        width:calc(100% - 80px);
        margin-left:80px;
    }

    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .quick-grid{
        grid-template-columns:repeat(2,1fr);
    }
}


@media(max-width:700px){

    .main{
        padding:20px 15px;
    }

    .topbar{
        align-items:flex-start;
    }

    .digital-clock{
        display:none;
    }

    .page-heading h1{
        font-size:23px;
    }

    .hero{
        padding:23px;
    }

    .stats-grid{
        grid-template-columns:1fr;
    }

    .quick-grid{
        grid-template-columns:1fr 1fr;
    }

    .campus-grid{
        grid-template-columns:1fr;
    }
}


@media(max-width:430px){

    .sidebar{
        width:65px;
    }

    .main{
        width:calc(100% - 65px);
        margin-left:65px;
        padding:15px 10px;
    }

    .quick-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

function openPage(page){

document.querySelectorAll(".nav-item").forEach(item=>{

item.classList.remove("active");

if(item.dataset.page===page){
    item.classList.add("active");
}

});


const titles={

dashboard:"Dashboard",
courses:"My Courses",
timetable:"Timetable",
assignments:"Assignments",
attendance:"Attendance",
campus:"Campus",
settings:"Settings"

};


pageTitle.textContent=titles[page];

content.innerHTML=pages[page]();

updateDate();

window.scrollTo({
    top:0,
    behavior:"smooth"
});

}



/* =========================================================
   DATE
========================================================= */

function updateDate(){

const element=document.getElementById("todayDate");

if(!element)return;

const now=new Date();

element.textContent=
now.toLocaleDateString(
    "en-IN",
    {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
    }
);

}



/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

const now=new Date();

clock.textContent=
now.toLocaleTimeString(
    "en-IN",
    {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
    }
);

}

setInterval(updateClock,1000);

updateClock();



/* =========================================================

========================================================= */

document.querySelectorAll(".nav-item").forEach(button=>{

openPage(button.dataset.page);

});

});

let toastTimer;

function showToast(message){

toast.textContent=message;

toast.classList.add("show");

clearTimeout(toastTimer);

toastTimer=setTimeout(()=>{

toast.classList.remove("show");

},2300);

}

}
